<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
        }

        a:visited{
            color: darkblue;
        }

        a:hover{
            color: black;
            text-decoration: underline;
        }

        a:active{
            color: yellow;
        }

        a::after{
            content: ' [Link]';
            text-decoration: none;
            color: red;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Perzonalizando Links</h1>
    <ul>
        <li> <a href="https://github.com/fellypemarquess" target="_blank">Repositorioa</a></li>
        <li><a href="https://www.youtube.com/@NarutoGamerProBr" target="_blank">Canal do Youtube</a></li>
        <li> <a href="https://suap.ifg.edu.br/accounts/login/?next=/">Site do curso</a></li>
    </ul>
    
</body>
</html>
