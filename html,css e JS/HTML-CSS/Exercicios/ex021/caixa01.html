<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando uma box</title>
    <style>
        h1{
            background-color: blueviolet;
            height: 500px;
            width: 400px;
            border: 50px;
            border-width: 50px;
            border-style: solid;
            border-color: brown;

            padding: 50px 50px 50px 50px;

            margin-top: 50px;
            margin-right: 50px;
            margin-bottom: 50px;
            margin-left: 50px;

            outline-style: dashed;
            outline-width: 50px;
            outline-color: aqua;
        }
        p{
            background-color: blue;
            display: block;
            height: 200px;
            width: 500px;
            border-radius: 50px;
            border-color: rebeccapurple;
        }

        a{
            border-width: 50px;
            border-color: brown;
            border-style: solid;
        }
    </style>
</head>
<body>
    <h1>O h1 é exemplo de box level</h1>
    <p>Paragrafo também é box level mas o link é inline-level <a href="#">inlines</a></p>
</body>
</html>
