<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'love';
            src: url('fonts/Love.ttf') format('truetype');
            font-weight: normal;
        }

        @font-face {
            font-family: 'helicop';
            src: url('fonts/Bring\ Me\ A\ Helicopter!.otf') format('opentype');
        }
        body{
            font-family: 'love','Times New Roman', Times, serif;

        }

        h1{
            font-family: 'helicop';
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Titulo 1</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Libero, nesciunt dicta. Facilis optio reprehenderit similique? Ex doloribus fugiat, eligendi quis officia voluptatem id perspiciatis qui adipisci fuga consequuntur voluptates aliquid!</p>

</html>
